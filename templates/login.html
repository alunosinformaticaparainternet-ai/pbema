<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PBEMA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf7ff, #ffffff);
            color: #17213a;
            display: flex;
            flex-direction: column;
        }

        .topo {
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #1769aa, #2696ca, #43b5e8);
        }

        .pagina {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .card-login {
            width: 100%;
            max-width: 470px;
            background: #ffffff;
            border-radius: 24px;
            padding: 45px;
            border: 1px solid #e4edf5;
            box-shadow: 0 15px 40px rgba(25, 76, 120, 0.13);
            position: relative;
            overflow: hidden;
        }

        .card-login::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1769aa, #2696ca, #43b5e8);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #1769aa, #2696ca);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(38, 150, 202, 0.25);
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 32px;
        }

        .cabecalho h1 {
            font-size: 31px;
            font-weight: 800;
            color: #173b6d;
            margin-bottom: 8px;
        }

        .cabecalho p {
            color: #718096;
            font-size: 15px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #30445f;
            margin-bottom: 8px;
        }

        .campo-input {
            position: relative;
        }

        .icone {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #7a91aa;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1.5px solid #d8e2ec;
            border-radius: 11px;
            background: #f8fbfd;
            padding: 0 15px 0 45px;
            font-size: 16px;
            color: #17213a;
            outline: none;
            transition: 0.25s;
        }

        input::placeholder {
            color: #a2afbd;
        }

        input:hover {
            border-color: #b9ccdc;
        }

        input:focus {
            border-color: #2696ca;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(38, 150, 202, 0.10);
        }

        button {
            width: 100%;
            min-height: 54px;
            margin-top: 7px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2452a4, #1769aa);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(36, 82, 164, 0.22);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(36, 82, 164, 0.28);
            background: linear-gradient(135deg, #1c438b, #125d96);
        }

        button:active {
            transform: translateY(0);
        }

        .esqueci {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2452a4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .esqueci:hover {
            color: #1769aa;
            text-decoration: underline;
        }

        .divisor {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0 20px;
            color: #9aa8b6;
            font-size: 12px;
            text-align: center;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e4eaf0;
        }

        .cadastro {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            border: 1px solid #d7e4ee;
            border-radius: 10px;
            color: #2452a4;
            background: #f8fbfd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .cadastro:hover {
            background: #eef8fd;
            border-color: #2696ca;
            color: #1769aa;
        }

        .mensagens {
            margin-top: 18px;
        }

        .mensagem {
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .erro {
            background: #fff0f0;
            border: 1px solid #ffcaca;
            color: #b42323;
        }

        .sucesso {
            background: #ecfdf3;
            border: 1px solid #b7ebc9;
            color: #16713a;
        }

        .aviso {
            background: #fff8e6;
            border: 1px solid #ffe1a3;
            color: #805b00;
        }

        .rodape {
            text-align: center;
            padding: 18px;
            color: #8191a3;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .pagina {
                padding: 30px 15px;
            }

            .card-login {
                padding: 35px 28px;
                border-radius: 20px;
            }

            .cabecalho h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 380px) {
            .card-login {
                padding: 30px 22px;
            }

            .logo {
                width: 62px;
                height: 62px;
                font-size: 23px;
            }

            .cabecalho h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="topo"></div>

    <main class="pagina">

        <section class="card-login">

            <div class="logo">PB</div>

            <div class="cabecalho">
                <h1>Bem-vindo ao PBEMA</h1>

                <p>
                    Entre na sua conta para acompanhar
                    as informações escolares.
                </p>
            </div>

            <form action="{{ url_for('pagina_login') }}" method="POST">

                <div class="campo">
                    <label for="email">E-mail cadastrado</label>

                    <div class="campo-input">
                        <span class="icone">👤</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="campo-input">
                        <span class="icone">🔒</span>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

            <button type="submit">
                 Entrar na minha conta
            </button>

            </form>

            
            <a
                href="{{ url_for('pagina_esqueci_senha') }}"
                class="esqueci"
            >
                Esqueci minha senha
            </a>

            <div class="divisor">
                Ainda não possui uma conta?
            </div>

            <a
                href="{{ url_for('pagina_cadastro') }}"
                class="cadastro"
            >
                Criar uma conta
            </a>

        </section>

    </main>

    <footer class="rodape">
        PBEMA • Acompanhamento Escolar
    </footer>

</body>
</html>
