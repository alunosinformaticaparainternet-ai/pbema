
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBEMA - Meu Perfil</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7faff;
            color: #1d3557;
        }

        /* CABEÇALHO */

        header {
            background: #087bd9;
            padding: 16px 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,.12);
        }

        .cabecalho {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cabecalho h1 {
            color: white;
            font-size: 22px;
        }

        .voltar {
            background: white;
            color: #087bd9;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
        }

        /* CONTEÚDO */

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px 80px;
        }

        .titulo {
            margin-bottom: 22px;
        }

        .titulo h2 {
            color: #087bd9;
            font-size: 27px;
        }

        .titulo p {
            color: #667085;
            margin-top: 5px;
        }

        /* CARTÃO PERFIL */

        .perfil-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #e1e8f0;
            box-shadow: 0 6px 20px rgba(0,0,0,.05);
        }

        .topo-perfil {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }

        /* FOTO */

        .area-foto {
            position: relative;
            width: 110px;
            height: 110px;
            flex-shrink: 0;
        }

        .foto {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #087bd9;
            cursor: pointer;
            display: block;
        }

        .foto-padrao {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #087bd9;
            background: #eef4f8;
            color: #087bd9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .foto-padrao span {
            font-size: 38px;
            font-weight: bold;
        }

        .foto-padrao small {
            font-size: 11px;
            font-weight: bold;
        }

        .area-foto:hover .foto,
        .area-foto:hover .foto-padrao {
            opacity: .8;
        }

        .topo-perfil h3 {
            color: #174a7c;
            font-size: 23px;
        }

        .topo-perfil p {
            color: #7a8797;
            margin-top: 5px;
        }

        /* CAMPOS */

        .campos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            color: #174a7c;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #d7e0ea;
            border-radius: 10px;
            outline: none;
            color: #344054;
            font-size: 14px;
            background: #f9fbfd;
            transition: .2s;
        }

        .campo input:focus {
            border-color: #087bd9;
            background: white;
            box-shadow: 0 0 0 3px rgba(8,123,217,.10);
        }

        .campo input:disabled {
            background: #f2f4f7;
            color: #667085;
        }

        /* BOTÕES */

        .acoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .editar {
            background: #087bd9;
            color: white;
        }

        .editar:hover {
            background: #0669ba;
        }

        .salvar {
            display: none;
            background: #087bd9;
            color: white;
        }

        .cancelar {
            display: none;
            background: #eef2f6;
            color: #344054;
        }

        .mensagem {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            background: #ecfdf3;
            color: #067647;
            text-align: center;
            font-size: 14px;
        }

        @media(max-width:650px) {
            .campos {
                grid-template-columns: 1fr;
            }

            .topo-perfil {
                flex-direction: column;
                text-align: center;
            }

            .acoes {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="cabecalho">
            <h1>PBEMA</h1>
            <a href="{{ url_for('pagina_inicio') }}" class="voltar">← Início</a>
        </div>
    </header>

    <main>

        <section class="titulo">
            <h2>Meu perfil</h2>
            <p>Consulte e edite suas informações pessoais.</p>
        </section>

        <section class="perfil-card">

            <div class="topo-perfil">

                <!-- FOTO DE PERFIL DA LUCILENE -->
                <div class="area-foto">

                    <img
                        id="fotoPerfil"
                        class="foto"
                        src=""
                        alt="Foto de perfil de Lucilene Correa"
                        title="Clique para alterar a foto"
                        onclick="selecionarFoto()"
                        style="display: none;"
                    >

                    <input
                        type="file"
                        id="arquivoFoto"
                        accept="image/*"
                        style="display: none;"
                        onchange="alterarFoto(event)"
                    >

                    <div
                        id="fotoPadrao"
                        class="foto-padrao"
                        onclick="selecionarFoto()"
                        title="Clique para adicionar uma foto"
                    >
                        <span>+</span>
                        <small>Adicionar foto</small>
                    </div>

                </div>

                <div>
                    <h3 id="nomeTopo">Lucilene Correa</h3>
                    <p>Responsável pelo acompanhamento escolar</p>
                </div>

            </div>

            <div class="campos">

                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" id="nome" value="Lucilene Correa" disabled>
                </div>

                <div class="campo">
                    <label>CPF</label>
                    <input type="text" id="cpf" value="000.000.000-00" disabled>
                </div>

                <div class="campo">
                    <label>Data de nascimento</label>
                    <input type="date" id="nascimento" value="1985-05-15" disabled>
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input type="tel" id="telefone" value="(98) 99999-9999" disabled>
                </div>

                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" id="email" value="lucilene@email.com" disabled>
                </div>

                <div class="campo">
                    <label>Endereço</label>
                    <input type="text" id="endereco" value="São Luís - MA" disabled>
                </div>

            </div>

            <div class="acoes">

                <button class="editar" id="btnEditar" onclick="editarPerfil()">
                    Editar informações
                </button>

                <button class="cancelar" id="btnCancelar" onclick="cancelarEdicao()">
                    Cancelar
                </button>

                <button class="salvar" id="btnSalvar" onclick="salvarPerfil()">
                    Salvar alterações
                </button>

            </div>

            <div class="mensagem" id="mensagem">
                Informações atualizadas com sucesso!
            </div>

        </section>

    </main>

    <script>

        const campos = [
            "nome",
            "cpf",
            "nascimento",
            "telefone",
            "email",
            "endereco"
        ];

        /* CARREGAR DADOS SALVOS */

        window.onload = function() {

            campos.forEach(function(id) {

                const valor = localStorage.getItem("pbema_" + id);

                if (valor !== null) {
                    document.getElementById(id).value = valor;
                }

            });

            carregarFoto();
            atualizarNome();

        };

        /* ABRIR SELEÇÃO DE FOTO */

        function selecionarFoto() {
            document.getElementById("arquivoFoto").click();
        }

        /* ALTERAR FOTO */

        function alterarFoto(event) {

            const arquivo = event.target.files[0];

            if (!arquivo) return;

            if (!arquivo.type.startsWith("image/")) {
                alert("Selecione um arquivo de imagem válido!");
                event.target.value = "";
                return;
            }

            const leitor = new FileReader();

            leitor.onload = function(e) {

                const imagem = e.target.result;

                try {
                    localStorage.setItem("fotoLucilene", imagem);
                } catch (erro) {
                    alert("Não foi possível salvar a foto. Escolha uma imagem menor.");
                    return;
                }

                mostrarFoto(imagem);

            };

            leitor.readAsDataURL(arquivo);

        }

        /* MOSTRAR FOTO */

        function mostrarFoto(imagem) {

            const foto = document.getElementById("fotoPerfil");
            const padrao = document.getElementById("fotoPadrao");

            foto.src = imagem;
            foto.style.display = "block";
            padrao.style.display = "none";

        }

        /* CARREGAR FOTO SALVA */

        function carregarFoto() {

            const fotoSalva = localStorage.getItem("fotoLucilene");

            if (fotoSalva) {
                mostrarFoto(fotoSalva);
            }

        }

        /* EDITAR */

        function editarPerfil() {

            campos.forEach(function(id) {
                document.getElementById(id).disabled = false;
            });

            document.getElementById("btnEditar").style.display = "none";
            document.getElementById("btnSalvar").style.display = "block";
            document.getElementById("btnCancelar").style.display = "block";

        }

        /* SALVAR */

        function salvarPerfil() {

            const nome = document.getElementById("nome").value.trim();

            if (!nome) {
                alert("Digite o nome completo.");
                return;
            }

            campos.forEach(function(id) {

                localStorage.setItem(
                    "pbema_" + id,
                    document.getElementById(id).value
                );

                document.getElementById(id).disabled = true;

            });

            atualizarNome();

            document.getElementById("btnEditar").style.display = "block";
            document.getElementById("btnSalvar").style.display = "none";
            document.getElementById("btnCancelar").style.display = "none";

            const mensagem = document.getElementById("mensagem");

            mensagem.style.display = "block";

            setTimeout(function() {
                mensagem.style.display = "none";
            }, 3000);

        }

        /* CANCELAR */

        function cancelarEdicao() {

            campos.forEach(function(id) {

                const valor = localStorage.getItem("pbema_" + id);

                if (valor !== null) {
                    document.getElementById(id).value = valor;
                }

                document.getElementById(id).disabled = true;

            });

            atualizarNome();

            document.getElementById("btnEditar").style.display = "block";
            document.getElementById("btnSalvar").style.display = "none";
            document.getElementById("btnCancelar").style.display = "none";

        }

        /* ATUALIZAR NOME */

        function atualizarNome() {

            const nome = document.getElementById("nome").value;

            document.getElementById("nomeTopo").textContent = nome;

        }

    </script>

</body>
</html>
